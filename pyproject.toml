[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-evolving-mental"
version = "0.1.0"
description = "Offline-research PsyVEC implementation over AgentMental"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Research source; see AgentMental/LICENSE for upstream terms" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/psyvec"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

